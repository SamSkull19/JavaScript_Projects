<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glowing Age Calculator</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>

<body>
    <canvas id="particleCanvas"></canvas>

    <div class="theme_switch_container">
        <label for="checkbox" class="theme_switch">
            <input type="checkbox" id="checkbox">

            <div class="theme_slider">
                <span class="icon sun">☀️</span>

                <span class="icon moon">🌙</span>

                <div class="ball"></div>
            </div>
        </label>
    </div>

    <div class="calculator_box">
        <h1>Age Calculator</h1>

        <div class="input_box">
            <input type="text" id="dateInput" placeholder="Select your birth date" autocomplete="off">

            <input type="text" id="currentDateInput" placeholder="Select current date" autocomplete="off">

            <button class="ripple_btn">
                Calculate
            </button>
        </div>

        <p id="result"></p>

        <div class="history_container">
            <div class="history_header" id="historyHeader">
                <span class="history_title">History</span>
                <span class="history_arrow">▼</span>
            </div>
            
            <div class="history_list" id="historyList"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
